services:
  - type: web
    name: umutungo-backend
    runtime: go
    rootDir: backend
    buildCommand: >-
      go build -o bin/server ./cmd/server &&
      go build -o bin/migrate ./cmd/migrate
    startCommand: sh start.sh
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
